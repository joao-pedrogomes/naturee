<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" width="2100" height="900" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="hero-produtos-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3320"/>
      <stop offset="0.55" stop-color="#33503A"/>
      <stop offset="1" stop-color="#5C6B3E"/>
    </linearGradient>
    <linearGradient id="hero-produtos-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0A867"/>
      <stop offset="1" stop-color="#B4753F"/>
    </linearGradient>
    <radialGradient id="hero-produtos-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8DCC3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E8DCC3" stop-opacity="0"/>
    </radialGradient>
    <path
      id="hero-produtos-contour"
      fill="none"
      d="M-80 300 C 240 226 500 346 800 288 C 1090 232 1320 338 1610 284 C 1830 243 1990 298 2180 268"
    />
  </defs>

  <rect width="2100" height="900" fill="url(#hero-produtos-sky)"/>

  <!-- warm glow behind the clay disc -->
  <circle cx="1560" cy="250" r="560" fill="url(#hero-produtos-glow)"/>
  <circle cx="1560" cy="250" r="190" fill="url(#hero-produtos-sun)" opacity="0.85"/>
  <circle cx="1560" cy="250" r="252" fill="none" stroke="#E8DCC3" stroke-opacity="0.16" stroke-width="3"/>
  <circle cx="1560" cy="250" r="318" fill="none" stroke="#E8DCC3" stroke-opacity="0.09" stroke-width="3"/>

  <!-- topographic contour family -->
  <g stroke="#E8DCC3" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <use href="#hero-produtos-contour" y="-190" stroke-opacity="0.06"/>
    <use href="#hero-produtos-contour" y="-130" stroke-opacity="0.09"/>
    <use href="#hero-produtos-contour" y="-70" stroke-opacity="0.12"/>
    <use href="#hero-produtos-contour" y="-10" stroke-opacity="0.14"/>
    <use href="#hero-produtos-contour" y="50" stroke-opacity="0.11"/>
    <use href="#hero-produtos-contour" y="110" stroke-opacity="0.07"/>
  </g>

  <!-- scattered seeds -->
  <g fill="#E8DCC3" opacity="0.22">
    <circle cx="286" cy="176" r="7"/>
    <circle cx="418" cy="112" r="4"/>
    <circle cx="640" cy="204" r="5"/>
    <circle cx="968" cy="128" r="6"/>
    <circle cx="1178" cy="216" r="4"/>
    <circle cx="1892" cy="150" r="6"/>
  </g>

  <!-- rolling ground: back to front -->
  <path
    d="M0 512 C 268 452 434 556 704 514 C 980 470 1178 566 1452 516 C 1706 470 1902 542 2100 500 L2100 900 L0 900 Z"
    fill="#456A42" opacity="0.55"
  />
  <path
    d="M0 654 C 302 592 528 698 826 650 C 1124 602 1330 696 1628 646 C 1826 612 1966 664 2100 634 L2100 900 L0 900 Z"
    fill="#2E4A2E" opacity="0.72"
  />
  <path
    d="M0 748 C 210 716 360 776 566 752 C 772 728 900 690 1096 706 C 1292 722 1400 782 1610 766 C 1786 752 1930 716 2100 730 L2100 900 L0 900 Z"
    fill="#8B6A47" opacity="0.35"
  />
  <path
    d="M0 800 C 342 748 604 838 944 794 C 1284 750 1522 828 1822 788 C 1942 772 2022 784 2100 776 L2100 900 L0 900 Z"
    fill="#1F3524"
  />

  <!-- furrow lines on the front field -->
  <g stroke="#E8DCC3" stroke-opacity="0.08" stroke-width="3" fill="none">
    <path d="M0 846 C 350 796 610 884 950 842 C 1290 800 1526 874 1826 836 C 1944 821 2024 832 2100 824"/>
    <path d="M0 886 C 356 838 618 922 958 882 C 1298 842 1532 912 1832 876 C 1948 862 2028 872 2100 866"/>
  </g>
</svg>
